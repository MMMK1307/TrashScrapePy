<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">

    </head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        a {
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        body, html {
            min-height: 100vh;
            font-family: geist, Courier New, ui-serif, system-ui, sans-serif;
            font-size: 17px;
        }

        body {
            background: #000000;
            color: #ffffff;
        }

        .d {
            background: #3a3e41;
        }


        header {
            padding: 0.5em 1em;
            font-weight: 500;
            font-size: 17px;
            border-bottom: 1px #3a3e41 solid;
            background: #151719;
        }

        main {
            margin-top: 3em;
            padding: 0.5em 1em 2em 0;
            counter-reset: line-counter;
        }

        .line {
            display: flex;
            line-height: 2.5rem;
            font-size: 17px;
            padding: 0 1em;
        }

        .line::before {
            counter-increment: line-counter;
            content: counter(line-counter);
            min-width: 2.5rem;
            font-weight: normal;
            color: #e5f2ff78;
            font-size: 17px;
        }

        .line:hover {
            background-color: #ddf2fd1c;
        }

        .line h3 {
            color: #e5f2ff78;
            font-weight: normal;
            font-size: 17px;
        }

        .line .white {
            color: white;
        }

        .line a {
            color: orange;
        }

        .line select {
            background: transparent;
            min-width: 30em;
            color: white;
            font-family: Courier New, ui-serif, system-ui, sans-serif;
        }

        .line select>option {
            background-color: black;
            color: #e5f2ff78;
        }

        .send-btn {
            color: white;
            cursor: pointer;
        }

        .send-btn:hover {
            color: orange;
        }

        *::selection {
            color: white;
            background-color: #e5f2ff78;
        }

        ::-webkit-scrollbar {
            display: none;
        }

        footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            padding: 0 0.2em;
            font-weight: 300;
            border-top: 1px #3a3e41 solid;
            display: flex;
            justify-content: space-between;
            box-sizing: border-box;
            background-color: black;

            span {
                padding: 0 0.2em;
            }
        }
    </style>
    <body>
        <header>trash_scrape.py</header>
        <main>
            <div class="line">
                <h3>python3 trash_scrape.py --cli</h3>
            </div>
            <div class="line">
                <h3># a scrapper of 
                    <a target="_blank" href="https://scrapingsandbox.com/">https://scrapingsandbox.com/</a>
                </h3>
            </div>
            <div class="line">
                <h3># search for products</h3>
            </div>
            <div class="line">
                <h3 class="white">category: </h3>
            </div>
            <div class="line">
                <form>
                    <select id="category">
                        <option value="">All Categories</option>
                        {% for cat in categories %}
                            <option value="{{ cat }}">{{ cat }}</option>
                        {% endfor %}
                    </select>
                </form>
            </div>
            <div class="line">
                <div class="send-btn" onclick="loadEquipments()">
                    > send<span id="ret"></span>
                </div>
            </div>
            <div id="list-container"></div>
        </main>
        <footer>
            <div>
                <span> [upcs-0] </span> <span> 1:scrapper* </span> <span> 2:impreza </span>
            </div>
            <div>
                <span>"trash_scrape.py"</span> <span id="time-span">18:18</span>
            </div>
        </footer>
    </body>
    <script>
        function animateRet () {
            const ret = document.getElementById("ret");
            if (ret.innerText === "...") {
                ret.innerText = "";
            } else {
                ret.innerText += ".";
            }
            setTimeout(animateRet, 500);
        }
        animateRet();

        async function loadEquipments() {
            const category = document.getElementById("category").value;
            try {
                const response = await fetch(`/load-products?category=${category}`);
                if (!response.ok) {
                    return
                }
                document.getElementById("list-container").innerHTML = await response.text();
                setTimeout(updateScrollCounter, 500);
            } catch(err) {
                console.error(err);
            }
        }

        function updateTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            document.getElementById("time-span").innerText = `${hours}:${minutes}`
        }
        setInterval(updateTime, 500);
        updateTime();

        function updateScrollCounter() {
            const scrollContainer = document.getElementById("product-list-container");
            if(!scrollContainer) {
                return;
            }
            scrollContainer.addEventListener("scroll", () => {
                const endSpan = document.querySelector("#less-end span");
                let scrollPercent = Math.round(100 * scrollContainer.scrollTop / (scrollContainer.scrollHeight-scrollContainer.clientHeight));
                if(scrollPercent === 100) {
                    endSpan.innerText = `products.md (END)`;
                    return
                }
                endSpan.innerText = `products.md (${scrollPercent}%)`;
            })
        }
    </script>
</html>
